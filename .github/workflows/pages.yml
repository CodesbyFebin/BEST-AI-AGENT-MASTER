name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:catalog
      - run: npm run verify:crawl-graph
      - run: npm run verify:gsc
      - run: npm run verify:quarantine
      - run: npm run verify:publication
      - run: npm run verify:methodology
      - run: npm run verify:editorial
      - run: npm run typecheck
      - run: npm run lint
      - run: GITHUB_PAGES_STATIC=1 npm run build
      - run: |
          touch out/.nojekyll
          test -s out/index.html
          test -s out/sitemap.xml
          test -s out/robots.txt
          test -s out/api/search/index.html || test -s out/api/search/index.json || test -s out/api/search
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
