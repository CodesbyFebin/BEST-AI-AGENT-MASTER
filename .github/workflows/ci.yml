name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit
      - run: npm run verify:submissions
      - run: npm run verify:catalog
      - run: npm run verify:crawl-graph
      - run: npm run verify:gsc
      - run: npm run verify:gsc-release
      - run: npm run verify:quarantine
      - run: npm run verify:editorial
      - run: npm run verify:publication
      - run: npm run verify:methodology
      - run: npm run verify:freshness
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 scripts/validate-jsonld.py

  lighthouse-optional:
    if: ${{ vars.ENABLE_LIGHTHOUSE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Run opt-in Lighthouse laboratory checks on published routes
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.cjs
