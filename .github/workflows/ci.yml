name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify:catalog
      - run: npm run verify:crawl-graph
      - run: npm run verify:gsc
      - run: npm run verify:quarantine
      - run: npm run verify:publication
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate-jsonld.py
