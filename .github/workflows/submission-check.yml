name: Community submissions
on:
  pull_request:
    paths:
      - 'submissions/**'
      - 'scripts/validate-submission.mjs'
      - '.github/workflows/submission-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:submissions
